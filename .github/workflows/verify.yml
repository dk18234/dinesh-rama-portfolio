name: Verify portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm run build:pages
      - run: npm run verify:dist
      - name: Confirm published output matches source
        run: git diff --exit-code -- docs
